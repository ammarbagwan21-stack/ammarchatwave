<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ChatWave</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .login-box h1 {
            text-align: center;
            color: #312e81;
            font-size: 32px;
            margin-bottom: 8px;
        }

        .login-box p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #4f46e5;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }

        .signup-link {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
            font-size: 14px;
        }

        .signup-link a {
            color: #4f46e5;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h1>Login</h1>
        <p>Enter your username and password</p>

        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Example: ammar21" />
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" />
        </div>

        <button class="login-btn" onclick="loginUser()">Login</button>

        <div id="message" class="message"></div>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Create Account</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getDatabase,
            ref,
            get,
            update
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXmAbn5R3Ndau0XWcecVFw1HH2MIAp8KE",
            authDomain: "whatshapp-2fb44.firebaseapp.com",
            databaseURL: "https://whatshapp-2fb44-default-rtdb.firebaseio.com",
            projectId: "whatshapp-2fb44",
            storageBucket: "whatshapp-2fb44.firebasestorage.app",
            messagingSenderId: "670669863082",
            appId: "1:670669863082:web:e186e5125a306b81ff78d3",
            measurementId: "G-WGFE5LJSZM"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        function showMessage(text, type = "success") {
            const message = document.getElementById("message");
            message.innerText = text;
            message.style.color = type === "success" ? "green" : "red";
        }

        function cleanUsername(username) {
            return username.toLowerCase().trim().replace(/[^a-z0-9_]/g, "");
        }

        window.loginUser = async function () {
            const username = cleanUsername(document.getElementById("username").value);
            const password = document.getElementById("password").value.trim();

            if (!username || !password) {
                showMessage("Please enter username and password", "error");
                return;
            }

            try {
                const usernameRef = ref(database, "usernames/" + username);
                const usernameSnapshot = await get(usernameRef);

                if (!usernameSnapshot.exists()) {
                    showMessage("Username not found", "error");
                    return;
                }

                const userData = usernameSnapshot.val();
                const email = userData.email;

                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await update(ref(database, "users/" + user.uid), {
                    lastLogin: new Date().toISOString()
                });

                showMessage("Login successful! Redirecting...");

                setTimeout(() => {
                    window.location.href = "chat.html";
                }, 1200);
            } catch (error) {
                showMessage("Invalid username or password", "error");
            }
        };
    </script>
</body>

</html>
